[project]
name = "maya"
version = "1.4.18"
description = "Aarhus City Archives client for generating individual browser-based GUI-clients"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "arrow==1.3.0",
    "boto3==1.40.4",
    "click==8.1.7",
    "concurrent-log-handler==0.9.25",
    "gunicorn==23.0.0",
    "httpx2==2.12.0",
    "itsdangerous==2.1.2",
    "jinja2==3.1.6",
    "markdown==3.8.1",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.31",
    "pyyaml==6.0.2",
    "starlette==1.3.1",
    "uv>=0.11.7",
    "uvicorn==0.30.6",
    "watchfiles==0.24.0",
]
[[project.authors]]
name = "Aarhus Stadsarkiv"
email = "stadsarkiv@aarhus.dk"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
maya = "maya.commands.cli:cli"

[tool.setuptools]
include-package-data = true

[tool.black]
line-length = 140

[tool.mypy]
exclude = [".venv", ".venv-docs", "tests", "example-config", "build", "bin-local", "sites"]

[tool.bump_version]
version_file = "maya/__init__.py"

[tool.setuptools.package-data]
maya = ["locales/**", "templates/**", "static/**", ".env-dist"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests"]

[tool.bump_version.replace_patterns.uv]
file = "sites/demo/docs/01-maya.md"
search = "<!-- LATEST-VERSION-UV -->"
replace = "\tuv tool install git+https://github.com/aarhusstadsarkiv/maya@{version}\n"

[dependency-groups]
dev = [
    "autopep8==2.0.1",
    "beautifulsoup4==4.12.2",
    "black==26.3.1",
    "boto3-stubs==1.40.4",
    "flake8==7.2.0",
    "mypy==1.17.1",
    "types-boto3[s3]>=1.42.41",
    "types-markdown==3.5.0.20240106",
    "types-python-dateutil==2.9.0.20241003",
    "types-pyyaml==6.0.12.8",
]
